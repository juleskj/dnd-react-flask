services:
  mariadb:
    image: mariadb:10.6.20
    container_name: dnd_mariadb
    environment:
      MYSQL_ROOT_PASSWORD: MyPasswordForYou
      MYSQL_DATABASE: dnd
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - 3306:3306

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: dnd_phpmyadmin
    depends_on:
      - mariadb
    environment:
      PMA_HOST: mariadb
      MYSQL_ROOT_PASSWORD: MyPasswordForYou
    ports:
      - 8080:80

volumes:
  mariadb_data:
